# SoundVisualizer Android (#1054). Yalnız Kotlin ve Google'ın androidx
# kütüphaneleri (docs/android/PLAN.md, D11). AGP 8.13, kurulu Android
# Studio'nun açabildiği sürüm; AGP 9'a geçiş ayrı bir iş. androidx.core
# 1.19 ve üstü AGP 9.1 ile API 37 istiyor, bu yüzden 1.18'de.
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
webkit = "1.18.0"
coreKtx = "1.18.0"
activity = "1.13.0"
junit = "4.13.2"

[libraries]
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
