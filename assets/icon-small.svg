<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- KÜÇÜK BOY simgesi (16-48 px): görev çubuğu, alt-tab, kısayollar.

       Büyük simge 1024'lük tuvalin yalnızca %87,5'ini kullanıyor (64 px kenar
       boşluğu) ve beş bardan her biri genişliğin %7'si. 24 px'e indirildiğinde
       bir bar 1,7 px kalıyor; barlar birbirine karışıp kırmızı bir lekeye
       dönüşüyordu. Burada glif tam kenara oturur, bar sayısı üçe iner ve her
       bar genişliğin %15,6'sını kaplar — 24 px'te 3,8 px, yani net.

       İnce ayrıntılar (diyagonal aksanlar, radyal parıltı, 2 px kenar çizgisi)
       bu boyutta yalnızca bulanıklık ürettiği için yok. -->
  <rect x="0" y="0" width="1024" height="1024" rx="256" fill="#111827"/>

  <!-- ekolayzer: merkezden simetrik üç pill bar -->
  <g fill="#dc2727">
    <rect x="152" y="312" width="160" height="400" rx="80"/>
    <rect x="432" y="182" width="160" height="660" rx="80"/>
    <rect x="712" y="312" width="160" height="400" rx="80"/>
  </g>

  <!-- beyaz çekirdek vurgusu (cayadev iki tonu) -->
  <rect x="432" y="470" width="160" height="84" rx="42" fill="#ffffff" opacity="0.94"/>
</svg>
