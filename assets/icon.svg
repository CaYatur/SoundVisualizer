<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#dc2727" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#dc2727" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#dc2727" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect x="64" y="64" width="896" height="896" rx="224"/>
    </clipPath>
  </defs>

  <!-- cayadev lacivert zemin -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="#111827"/>

  <!-- marka diyagonal aksanları (cayadev kimliği) -->
  <g clip-path="url(#round)" fill="#ffffff" opacity="0.06">
    <rect x="-120" y="150" width="1264" height="86" rx="43" transform="rotate(-24 512 512)"/>
    <rect x="-120" y="300" width="1264" height="86" rx="43" transform="rotate(-24 512 512)"/>
  </g>

  <!-- kırmızı parıltı -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#glow)"/>

  <!-- minimalist ekolayzer — merkezden simetrik açılan pill barlar (yatayda ortalı) -->
  <g fill="#dc2727">
    <rect x="252" y="412" width="72" height="200" rx="36"/>
    <rect x="364" y="342" width="72" height="340" rx="36"/>
    <rect x="476" y="277" width="72" height="470" rx="36"/>
    <rect x="588" y="342" width="72" height="340" rx="36"/>
    <rect x="700" y="412" width="72" height="200" rx="36"/>
  </g>

  <!-- ince beyaz çekirdek vurgusu (cayadev iki tonu) -->
  <rect x="476" y="486" width="72" height="52" rx="26" fill="#ffffff" opacity="0.92"/>

  <!-- ince kenar -->
  <rect x="68" y="68" width="888" height="888" rx="220" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</svg>
