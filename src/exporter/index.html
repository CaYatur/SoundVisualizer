<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
    <title>Dışa Aktarma Render</title>
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      /* Kanvaslar yalnızca offscreen render içindir; ekrana çizilmez. */
      canvas { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <!-- WebGL gradyan arkaplan -->
    <canvas id="gl"></canvas>
    <!-- 2D ön görselleştirici (bars/wave/circular/centerBars) -->
    <canvas id="c2d"></canvas>
    <!-- Birleştirme (composite) yüzeyi — kare baytları buradan okunur -->
    <canvas id="comp"></canvas>

    <script src="../shared/defaults.js"></script>
    <script src="../visualizer/audio.js"></script>
    <script src="../visualizer/modes/gradient.js"></script>
    <script src="../visualizer/modes/bars.js"></script>
    <script src="../visualizer/modes/centerbars.js"></script>
    <script src="../visualizer/modes/wave.js"></script>
    <script src="../visualizer/modes/circular.js"></script>
    <script src="../visualizer/modes/sprites.js"></script>
    <script src="exporter.js"></script>
  </body>
</html>
