<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
    <title>Dışa Aktarma Render</title>
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      /* Kanvaslar yalnızca offscreen render içindir; ekrana çizilmez. */
      canvas { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <!-- Katman tuvalleri buraya eklenir; ekrana çizilmez, yalnızca
         birleştirme yüzeyine basılır. -->
    <div id="stage"></div>
    <!-- Birleştirme (composite) yüzeyi — kare baytları buradan okunur -->
    <canvas id="comp"></canvas>

    <script src="../shared/presets.js"></script>
